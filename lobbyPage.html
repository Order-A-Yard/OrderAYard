<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Lobby - Scotland Yard Website</title>
    <script src="lobbyPage.js" defer></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="lobby-container">
            <h1>Game Lobby</h1>
            
            <!-- QR Code and Game Code Section -->
            <div class="lobby-header">
                <div class="qr-code-section">
                    <div class="qr-code-placeholder">
                        <!-- QR Code will go here -->
                        <p>QR Code</p>
                    </div>
                </div>
                
                <div class="game-code-section">
                    <h2>Game Code</h2>
                    <div class="game-code-display" id="gameCodeDisplay">PlaceHolder</div>
                    <p class="game-code-instruction">Share this code with other players</p>
                </div>
            </div>
            
            <!-- Players Table -->
            <div class="players-section">
                <h2>Players</h2>
                <table class="players-table">
                    <thead>
                        <tr>
                            <th>Player</th>
                            <th>Color</th>
                            <th>Ready</th>
                        </tr>
                    </thead>
                    <tbody id="playersTableBody">
                        <tr class="player-row" data-player="1">
                            <td class="player-name">Waiting...</td>
                            <td class="player-color"><div class="color-indicator"></div></td>
                            <td class="player-ready">❌</td>
                        </tr>
                        <tr class="player-row" data-player="2">
                            <td class="player-name">Waiting...</td>
                            <td class="player-color"><div class="color-indicator"></div></td>
                            <td class="player-ready">❌</td>
                        </tr>
                        <tr class="player-row" data-player="3">
                            <td class="player-name">Waiting...</td>
                            <td class="player-color"><div class="color-indicator"></div></td>
                            <td class="player-ready">❌</td>
                        </tr>
                        <tr class="player-row" data-player="4">
                            <td class="player-name">Waiting...</td>
                            <td class="player-color"><div class="color-indicator"></div></td>
                            <td class="player-ready">❌</td>
                        </tr>
                        <tr class="player-row" data-player="5">
                            <td class="player-name">Waiting...</td>
                            <td class="player-color"><div class="color-indicator"></div></td>
                            <td class="player-ready">❌</td>
                        </tr>
                        <tr class="player-row" data-player="6">
                            <td class="player-name">Waiting...</td>
                            <td class="player-color"><div class="color-indicator"></div></td>
                            <td class="player-ready">❌</td>
                        </tr>
                    </tbody>
                </table>
            </div>
            
            <!-- Ready/Start Button -->
            <button class="lobby-action-button" id="readyButton" onclick="toggleReady()">
            
                Ready
            </button >
        <button href="/gamePage" class="lobby-action-button" id="readyButton" onclick="play()">
        Start Game
            </button >
        </div>
    </div>
    
    
    </body>

</html>
