<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Host Game - Scotland Yard Website</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="host-game-container">
            <h1>Host Game</h1>
            
            <!-- Name input -->
            <div class="form-group">
                <label for="playerName">Enter Your Name:</label>
                <input type="text" id="playerName" placeholder="Your name here..." />
            </div>
            
            <!-- Colour selector -->
            <div class="color-selector">
                <label>Select Your Colour:</label>
                <button class="color-button" onclick="toggleColourWheel()">
                    Choose Colour
                </button>
                <div id="selectedColourDisplay" class="selected-color-display">
                    No colour selected
                </div>
                <div id="colourWheel" class="color-wheel">
         
                    <div class="color-option" style="background-color: #FF0000;" onclick="selectColour('#FF0000', 'Red', this)"> </div>
                    <div class="color-option" style="background-color: #00FF00;" onclick="selectColour('#00FF00', 'Green', this)"></div>
                    <div class="color-option" style="background-color: #0000FF;" onclick="selectColour('#0000FF', 'Blue', this)"></div>
                    <div class="color-option" style="background-color: #FFFF00;" onclick="selectColour('#FFFF00', 'Yellow', this)"></div>
                    <div class="color-option" style="background-color: #FF00FF;" onclick="selectColour('#FF00FF', 'Magenta', this)"></div>
                    <div class="color-option" style="background-color: #00FFFF;" onclick="selectColour('#00FFFF', 'Cyan', this)"></div>
                    <div class="color-option" style="background-color: #FFA500;" onclick="selectColour('#FFA500', 'Orange', this)"></div>
                    <div class="color-option" style="background-color: #800080;" onclick="selectColour('#800080', 'Purple', this)"></div>
                </div>
            </div>
            
            <!-- Start game button -->
            <button href="/lobbyPage" class="bottom-button" id="startButton" onclick="startGame()" >
                Start Game
            </button>
        </div>
    </div>
    <script src="hostGame.js"></script>
    
</body>
</html>
