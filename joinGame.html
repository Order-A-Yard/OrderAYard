<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join Game - Scotland Yard Website</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="host-game-container">
            <h1>Join Game</h1>
            
            <!-- Name input -->
            <div class="form-group">
                <label for="playerName">Enter Your Name:</label>
                <input type="text" id="playerName" placeholder="Your name here..." />
            </div>
            
            <!-- Colour selector -->
            <div class="color-selector">
                <label>Select Your Colour:</label>
                <button class="color-button" onclick="toggleColourWheel()">
                    Choose Colour
                </button>
                <div id="selectedColorDisplay" class="selected-color-display">
                    No colour selected
                </div>
                <div id="colorWheel" class="color-wheel">
                    <div class="color-option" style="background-color: #FF0000;" onclick="selectColour('#FF0000', 'Red')"></div>
                    <div class="color-option" style="background-color: #00FF00;" onclick="selectColour('#00FF00', 'Green')"></div>
                    <div class="color-option" style="background-color: #0000FF;" onclick="selectColour('#0000FF', 'Blue')"></div>
                    <div class="color-option" style="background-color: #FFFF00;" onclick="selectColour('#FFFF00', 'Yellow')"></div>
                    <div class="color-option" style="background-color: #FF00FF;" onclick="selectColour('#FF00FF', 'Magenta')"></div>
                    <div class="color-option" style="background-color: #00FFFF;" onclick="selectColour('#00FFFF', 'Cyan')"></div>
                    <div class="color-option" style="background-color: #FFA500;" onclick="selectColour('#FFA500', 'Orange')"></div>
                    <div class="color-option" style="background-color: #800080;" onclick="selectColour('#800080', 'Purple')"></div>
                </div>
                
                <!-- Colour clear -->
                <button class="color-button" onclick="refreshColours()" style="margin-top: 10px;">
                    Clear colour choice
                </button>
            </div>
            
            <!-- Game code input -->
            <div class="form-group">
                <label for="gameCode">Enter Game Code:</label>
                <input type="text" id="gameCode" placeholder="Enter 6-digit code..." maxlength="6" />
            </div>
            
            <!-- Join game button -->
            <button class="bottom-button" id="bottom-button">
                Join Game
            </button>
        </div>
    </div>

    <script src="joinGame.js"></script>
</body>
</html>
