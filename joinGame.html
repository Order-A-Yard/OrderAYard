<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join Game - Scotland Yard Website</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="host-game-container">
            <h1>Join Game</h1>
            
            <!-- Name Input -->
            <div class="form-group">
                <label for="playerName">Enter Your Name:</label>
                <input type="text" id="playerName" placeholder="Your name here..." />
            </div>
            
            <!-- Game Code Input -->
            <div class="form-group">
                <label for="gameCode">Enter Game Code:</label>
                <input type="text" id="gameCode" placeholder="Enter 6-digit code..." maxlength="6" />
            </div>
            
            <!-- Join Game Button -->
            <button class="bottom-button" id="bottom-button">
                Join Game
            </button>
        </div>
    </div>
    <script src="joinGame.js" defer></script>
</body>
</html>
