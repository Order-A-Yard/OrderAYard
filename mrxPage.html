<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mr Yard - Scotland Yard</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="gamePage.css">
    <link rel="stylesheet" href="mrxPage.css">
    <script src="gamePage.js" defer></script>
</head>
<body class="mrx-theme">
    <div class="game-container">
        <!-- Map display and information -->
        <div class="game-map-section">
            <div class="game-map" id="gameMap">
                <img src="OrderAYardFinalMap.png" alt="Game Map" class="map-image">
                <div class="map-inner">
                    <img id="captureToggle" src="OrderAYardLogo20262.png" style="position:absolute; top:-10px; right:-50px; width:300px; height:300px; cursor:pointer; z-index:200;" title="Toggle Coordinate Capture Tool">
                    <div id="capturedMarkers"></div>
                    <div id="playerPiece1" class="other-player-piece" draggable="true">
                    </div>
                    <div id="playerPiece" class="player-piece" draggable="true"></div>                        
                    </div>
                    <div id="locationMarkers"></div>
                </div>
            </div>
        </div>
    
        
        <!-- Mr Yard/map controls -->
        <div class="game-controls-section">
            <!-- Mr Yard name -->
            <div class="player-info">
                <h2 id="playerName">Mr Yard</h2>
            </div>
            
            <!-- View map button -->
            <button class="view-map-button" onclick="viewLargerMap()">
                🔍 View Larger Map
            </button>
            
        
            
            <!-- Tickets section -->
            <div class="tickets-section">
                <h3>Tickets</h3>
                <div class="tickets-buttons">
                    <button class="ticket-button bus" onclick="selectTicket('bus')" id="busTicket">
                         Bus
                        <span class="ticket-count">10</span>
                    </button>
                    <button class="ticket-button ebike" onclick="selectTicket('ebike')" id="ebikeTicket">
                         E-Bike
                        <span class="ticket-count">5</span>
                    </button>
                    <button class="ticket-button taxi" onclick="selectTicket('taxi')" id="taxiTicket">
                         Taxi
                        <span class="ticket-count">3</span>
                    </button>
                    <button class="ticket-button boat" onclick="selectTicket('boat')" id="boatTicket">
                         Boat
                        <span class="ticket-count">6</span>
                    </button>
                </div>
            </div>
            
            <!-- Position and move section -->
                 <div class="movement-log-section">
            <h3>Movement Log</h3>
            <div id="movementLog" class="movement-log"></div>
            </div>

            <div class="position-move-section">
                <div class="position-display">
                    <label>Current Position:</label>
                    <div class="position-value" id="currentPosition">45</div>
                </div>
                <button class="make-move-button" onclick="makeMove()">
                    Make Move
                </button>
            </div>
        </div>
    </div>
    
    <!-- Modal for larger map view -->
    <div id="mapModal" class="map-modal">
        <div class="map-modal-content">
            <span class="map-modal-close" onclick="closeMapModal()">&times;</span>
            <img src="OrderAYardFinalMap.png" alt="Full Map" class="map-modal-image">
        </div>
    </div> 

    
</body>
</html>
